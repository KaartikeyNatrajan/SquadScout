syntax = "proto3";

// Contract between langgraph_service (client) and fpl_data_service (server).
// Edit this file, then run `make proto` to regenerate Go and Python code.
//
// How to read it:
//   service ... { rpc X(Req) returns (Resp); }  = a remote function: the Python
//       side calls X with a Req message and gets a Resp back.
//   message = a data structure (like a class with only fields).
//   The "= 1", "= 2" after each field are NOT default values. They are field
//   numbers used in the binary wire format. Never change or reuse them once
//   in use; add new fields with new numbers instead.
package squadscout.v1;

option go_package = "squad_scout/fpl_data_service/gen/squadscout/v1;squadscoutv1";

// All player-specific RPCs take the player's FPL id, which comes from
// SearchPlayers or FindPlayers. Manager RPCs take the manager's FPL team id
// (the number in the URL of their FPL points page). None of them needs a
// gameweek number from the caller except GetPlayerGameweekStats.
service FplDataService {
  // ----- Players and fixtures -----

  // Find players by name ("saka", "odegaard"), ignoring case and accents.
  // Best total points first, so the most likely match comes first.
  rpc SearchPlayers(SearchPlayersRequest) returns (SearchPlayersResponse);

  // A team's next fixtures, soonest first.
  rpc GetFixtures(GetFixturesRequest) returns (GetFixturesResponse);

  // One player's stats for one gameweek.
  rpc GetPlayerGameweekStats(GetPlayerGameweekStatsRequest) returns (GetPlayerGameweekStatsResponse);

  // One player's last few gameweeks plus totals over them
  // ("how has X been playing lately?").
  rpc GetPlayerRecentForm(GetPlayerRecentFormRequest) returns (GetPlayerRecentFormResponse);

  // One player's next fixtures from his team's point of view (opponent,
  // home/away, difficulty), plus FPL's expected points for the next gameweek.
  rpc GetPlayerFixtures(GetPlayerFixturesRequest) returns (GetPlayerFixturesResponse);

  // Players matching filters (position, price, availability), best first by
  // a chosen measure. For finding transfer targets.
  rpc FindPlayers(FindPlayersRequest) returns (FindPlayersResponse);

  // The most transferred in (or out) players for the next gameweek.
  rpc GetTransferTrends(GetTransferTrendsRequest) returns (GetTransferTrendsResponse);

  // ----- News from outside FPL -----

  // Recent press stories about a player (injury, fitness, rest, suspension,
  // team news, press conferences), newest first, plus FPL's own `news` for him.
  // Stories are quoted as published: the caller decides what they mean.
  rpc GetPlayerNews(GetPlayerNewsRequest) returns (GetPlayerNewsResponse);

  // Recent press stories about a club, newest first.
  rpc GetTeamNews(GetTeamNewsRequest) returns (GetTeamNewsResponse);

  // ----- A manager's team -----

  // A manager's squad with each player's availability, expected points and
  // next fixtures, plus bank, free transfers and chips left.
  rpc GetManagerTeam(GetManagerTeamRequest) returns (GetManagerTeamResponse);

  // Checks a set of transfers against every FPL squad rule (the "verifier")
  // and reports the cost (points hit, money) and expected points gained.
  rpc EvaluateTransfers(EvaluateTransfersRequest) returns (EvaluateTransfersResponse);

  // Searches for the best transfers (1 to 3 of them), checking every
  // candidate against the squad rules, and ranks them by projected points
  // gained minus the points hit.
  rpc SuggestTransfers(SuggestTransfersRequest) returns (SuggestTransfersResponse);
}

// ---------- Players ----------

message Player {
  int32 id = 1;          // FPL element id (FPL calls players "elements")
  string web_name = 2;   // "Saka"
  string first_name = 3;
  string second_name = 4;
  int32 team_id = 5;
  string team_name = 6;
  Position position = 7;  // enum, defined below
  double price = 8;      // in £m (FPL stores tenths: 105 -> 10.5)
  int32 total_points = 9;
  double form = 10;      // average points per match over roughly the last 30 days
  double selected_by_percent = 11;
  string status = 12;    // FPL's code: "a" available, "d" doubtful, "i" injured, ...

  // Availability in plain words, so the reader doesn't need FPL's codes:
  // "available", "doubtful", "injured", "suspended", "unavailable", "ineligible".
  string availability = 13;
  // Injury or transfer news, e.g. "Hamstring injury - 75% chance of playing".
  // Empty when there is none.
  string news = 14;
  // 0-100. Unset means FPL has no concerns (normally fully fit), which is
  // different from 0 (definitely out); "optional" keeps the two apart.
  optional int32 chance_of_playing_next_round = 15;

  // Season totals so far.
  int32 minutes = 16;
  int32 starts = 17;
  int32 goals_scored = 18;
  int32 assists = 19;
  int32 clean_sheets = 20;
  int32 bonus = 21;
  double expected_goals = 22;              // xG
  double expected_assists = 23;            // xA
  double expected_goal_involvements = 24;  // xG + xA
  double points_per_game = 25;

  // FPL's own projection of this player's points in the next gameweek
  // (all of his matches in it, if he has two).
  double expected_points_next = 26;

  // Transfer activity since the last deadline, across all FPL managers.
  int32 transfers_in_event = 27;
  int32 transfers_out_event = 28;
  double price_change_event = 29;  // £m change since the last deadline, e.g. 0.1 or -0.1
  string news_added = 30;          // when `news` was last updated (RFC 3339); empty if no news

  // What other FPL managers are doing with him: a sign of the crowd's view
  // (form, fixtures, injury worries). Counted over all managers.
  int32 net_transfers_event = 31;     // managers who bought him minus those who sold him, since the last deadline
  double net_transfers_percent = 32;  // that as a % of ALL managers (2.8 = 2.8% of everyone bought him)
  int32 net_bought_rank = 33;         // 1 = the player most net bought this gameweek
  int32 net_sold_rank = 34;           // 1 = the player most net sold this gameweek
  // Net transfers over the last 24 hours, across a deadline if need be. Unset
  // until the service has 24 hours of history.
  optional int32 net_transfers_24h = 35;
  string transfer_sentiment = 36;     // the above in a sentence, e.g. "heavily bought: net +2.80% ..."
  // How far he is towards his next price change: -100 (a fall) .. +100 (a rise).
  double price_change_progress = 37;
  string price_change_outlook = 38;   // e.g. "likely to rise at the next price update"
}

// Proto3 enums must start at 0, and 0 is the default when a field is unset,
// so 0 is reserved for "unknown".
enum Position {
  POSITION_UNSPECIFIED = 0;
  POSITION_GOALKEEPER = 1;
  POSITION_DEFENDER = 2;
  POSITION_MIDFIELDER = 3;
  POSITION_FORWARD = 4;
}

message SearchPlayersRequest {
  string name = 1;
  int32 limit = 2;  // 0 = server default (5); at most 20
}

message SearchPlayersResponse {
  repeated Player players = 1;  // "repeated" = a list; empty when nothing matches
}

// ---------- Fixtures ----------

message Fixture {
  int32 id = 1;
  int32 gameweek = 2;  // 0 if not scheduled yet (e.g. postponed)
  int32 home_team_id = 3;
  string home_team_name = 4;
  int32 away_team_id = 5;
  string away_team_name = 6;
  string kickoff_time = 7;  // RFC 3339, e.g. "2026-10-10T11:30:00Z"; empty if not scheduled
  int32 home_difficulty = 8;  // FDR 1 (easy) - 5 (hard) for the home team
  int32 away_difficulty = 9;  // the same for the away team
  bool finished = 10;
  // "optional" lets the reader tell "not set" (match not played) apart from 0.
  optional int32 home_score = 11;
  optional int32 away_score = 12;
}

message GetFixturesRequest {
  int32 team_id = 1;
  int32 next_n = 2;  // 0 = all remaining fixtures
  // Alternative to team_id: the team's name or short name, e.g. "Arsenal",
  // "Man Utd" or "ARS". Ignored if team_id is set.
  string team_name = 3;
}

message GetFixturesResponse {
  repeated Fixture fixtures = 1;  // soonest first
}

// One upcoming fixture seen from one team's side, so the reader doesn't have
// to work out which half of a Fixture applies to the player.
message PlayerFixture {
  int32 fixture_id = 1;
  int32 gameweek = 2;       // 0 if not scheduled yet
  string kickoff_time = 3;  // RFC 3339; empty if not scheduled
  int32 opponent_team_id = 4;
  string opponent_team_name = 5;
  bool is_home = 6;
  int32 difficulty = 7;     // FDR 1 (easy) - 5 (hard) for the player's team
}

message GetPlayerFixturesRequest {
  int32 player_id = 1;
  int32 next_n = 2;  // 0 = server default (5); at most 10
}

message GetPlayerFixturesResponse {
  int32 player_id = 1;
  string web_name = 2;
  string team_name = 3;
  int32 next_gameweek = 4;          // 0 once the season is over
  double expected_points_next = 5;  // FPL's projection for next_gameweek
  repeated PlayerFixture fixtures = 6;  // soonest first
}

// ---------- Stats ----------

// One player's stats for one gameweek: FPL's totals across every match his
// team played that week (usually one; two in a "double gameweek").
message GameweekStats {
  int32 player_id = 1;
  int32 gameweek = 2;
  int32 minutes = 3;
  int32 goals_scored = 4;
  int32 assists = 5;
  int32 clean_sheets = 6;
  int32 bonus = 7;
  int32 total_points = 8;  // FPL points
  double expected_goals = 9;
  double expected_assists = 10;

  // Which match this was, when the gameweek had exactly one (almost always).
  // Left empty for a double gameweek: see match_results for both matches.
  int32 fixture_id = 11;
  int32 opponent_team_id = 12;
  string opponent_team_name = 13;
  bool was_home = 14;
  string kickoff_time = 15;      // RFC 3339
  optional int32 team_score = 16;      // the player's team's goals
  optional int32 opponent_score = 17;

  int32 starts = 18;  // matches he started this gameweek (0 if he came off the bench or didn't play)
  int32 goals_conceded = 19;
  int32 saves = 20;
  int32 yellow_cards = 21;
  int32 red_cards = 22;
  double expected_goal_involvements = 23;

  // Each match his team played this gameweek, with his minutes and points in it.
  repeated MatchResult match_results = 24;
}

// One match from a player's side.
message MatchResult {
  int32 fixture_id = 1;
  int32 opponent_team_id = 2;
  string opponent_team_name = 3;
  bool was_home = 4;
  string kickoff_time = 5;           // RFC 3339
  optional int32 team_score = 6;     // the player's team's goals; unset if not played yet
  optional int32 opponent_score = 7;
  int32 minutes = 8;                 // 0 if he didn't play
  int32 total_points = 9;            // his FPL points in this match
}

message GetPlayerGameweekStatsRequest {
  int32 player_id = 1;
  int32 gameweek = 2;
}

message GetPlayerGameweekStatsResponse {
  GameweekStats stats = 1;  // the gameweek's totals, with each match in stats.match_results
  // No longer filled: FPL reports full stats per gameweek, not per match.
  // Use stats.match_results for each match's minutes and points.
  repeated GameweekStats matches = 2 [deprecated = true];
}

message GetPlayerRecentFormRequest {
  int32 player_id = 1;
  int32 last_n = 2;  // number of gameweeks; 0 = server default (5); at most 10
}

message GetPlayerRecentFormResponse {
  int32 player_id = 1;
  string web_name = 2;
  // One entry per gameweek his team played in, most recent first. (The field
  // is called "matches" for compatibility; a double gameweek is one entry.)
  repeated GameweekStats matches = 3;
  FormSummary summary = 4;  // totals over `matches`
}

// Totals over a run of gameweeks, so the reader doesn't have to add them up.
message FormSummary {
  int32 matches = 1;      // gameweeks covered, including ones he didn't play in
  int32 appearances = 2;  // gameweeks in which he played at least one minute
  int32 minutes = 3;
  int32 goals_scored = 4;
  int32 assists = 5;
  int32 clean_sheets = 6;
  int32 bonus = 7;
  int32 total_points = 8;
  double expected_goals = 9;
  double expected_assists = 10;
  double points_per_match = 11;  // total_points / matches (points per gameweek)
}

// ---------- Finding players ----------

// Our own estimate of a player's points over the next few gameweeks. FPL only
// publishes expected points for the next gameweek, but transfer decisions are
// about several weeks. It is built from his recent minutes and points, his
// availability and how hard each opponent is, and counts a double gameweek
// twice and a blank gameweek as zero. A rough guide, not a promise.
message Projection {
  int32 horizon = 1;  // gameweeks covered, starting with the next one
  double total = 2;   // expected points over the whole horizon
  repeated GameweekProjection gameweeks = 3;
}

message GameweekProjection {
  int32 gameweek = 1;
  double expected_points = 2;
  int32 matches = 3;  // 0 = his club has no match that week
}

// A player plus his next few fixtures and our projection: enough to judge him
// as a transfer target without another call.
message PlayerOutlook {
  Player player = 1;
  repeated PlayerFixture next_fixtures = 2;  // the next 3, soonest first
  Projection projection = 3;
}

// What FindPlayers sorts by, best first.
enum PlayerSort {
  PLAYER_SORT_UNSPECIFIED = 0;     // = PLAYER_SORT_EXPECTED_POINTS
  PLAYER_SORT_EXPECTED_POINTS = 1; // FPL's expected points for the next gameweek
  PLAYER_SORT_FORM = 2;
  PLAYER_SORT_TOTAL_POINTS = 3;
  PLAYER_SORT_POINTS_PER_GAME = 4;
}

message FindPlayersRequest {
  Position position = 1;     // POSITION_UNSPECIFIED = any position
  double max_price = 2;      // £m; 0 = no limit
  PlayerSort sort_by = 3;
  int32 limit = 4;           // 0 = server default (5); at most 20
  // By default injured, suspended and unavailable players are left out
  // (doubtful ones stay in). Set this to include them.
  bool include_unavailable = 5;
  // If set, players already in this manager's squad are left out, so every
  // result is a possible transfer in.
  int32 exclude_squad_of_team_id = 6;
}

message FindPlayersResponse {
  repeated PlayerOutlook players = 1;
}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;  // = TRANSFER_DIRECTION_IN
  TRANSFER_DIRECTION_IN = 1;
  TRANSFER_DIRECTION_OUT = 2;
}

message GetTransferTrendsRequest {
  TransferDirection direction = 1;
  int32 limit = 2;  // 0 = server default (5); at most 20
}

message GetTransferTrendsResponse {
  int32 gameweek = 1;  // the gameweek these transfers are being made for
  repeated PlayerOutlook players = 2;  // most transferred first
}

// ---------- News ----------

message NewsItem {
  string title = 1;
  // What to read: the headline, plus the most relevant sentence of the story's
  // summary when the feed has one. At most ~200 characters.
  string snippet = 2;
  string source = 3;        // the outlet, e.g. "BBC Sport"
  string published_at = 4;  // RFC 3339, UTC
  string age = 5;           // e.g. "3 hours ago"
  string url = 6;
  // What the story is about: injury, fitness, return, suspension, rest,
  // team_news, press_conference. A topic is not a verdict: "injury" means injury
  // is discussed, not that this player is injured.
  repeated string topics = 7;
  // Other players named in the same story. A headline naming several players may
  // be about only one of them; check the wording.
  repeated string also_mentions = 8;
}

message GetPlayerNewsRequest {
  int32 player_id = 1;
  int32 limit = 2;  // 0 = server default (3); at most 10
  int32 hours = 3;  // only stories this recent; 0 or more than 72 = 72
}

message GetPlayerNewsResponse {
  Player player = 1;
  string fpl_news = 2;  // FPL's own news for him ("Knee injury - 75% chance of playing"); "" if none
  string fpl_news_added = 3;  // when FPL added it (RFC 3339); "" if none
  repeated NewsItem items = 4;
  // Plain words about coverage, e.g. "no press stories in the last 72 hours".
  string note = 5;
}

message GetTeamNewsRequest {
  int32 team_id = 1;
  string team_name = 2;  // used when team_id is 0; "Man City", "Spurs", "ARS"
  int32 limit = 3;  // 0 = server default (5); at most 10
  int32 hours = 4;  // 0 or more than 72 = 72
}

message GetTeamNewsResponse {
  int32 team_id = 1;
  string team_name = 2;
  repeated NewsItem items = 3;
  string note = 4;
}

// ---------- A manager's team ----------

message SquadPlayer {
  Player player = 1;
  repeated PlayerFixture next_fixtures = 2;  // the next 3, soonest first
  int32 squad_position = 3;  // 1-11 starting XI, 12-15 bench in substitution order
  bool is_captain = 4;
  bool is_vice_captain = 5;
  // What the manager would get for selling him (£m). FPL keeps only half of
  // any price rise since he was bought.
  double selling_price = 6;
  // True if we don't know what he was bought for (e.g. he has been in the
  // squad since the start), so selling_price is just his current price.
  bool selling_price_is_estimate = 7;
  Projection projection = 8;
}

message GetManagerTeamRequest {
  int32 team_id = 1;  // the manager's FPL team id
}

message GetManagerTeamResponse {
  int32 team_id = 1;
  string team_name = 2;
  string manager_name = 3;
  int32 overall_points = 4;
  int32 overall_rank = 5;
  // The gameweek whose squad this is. FPL only reveals a squad after the
  // deadline, so this is the last deadline's squad (or the one before it,
  // after a Free Hit, because the squad returns to normal afterwards).
  int32 squad_gameweek = 6;
  int32 next_gameweek = 7;
  string next_deadline = 8;  // RFC 3339
  double bank = 9;           // £m in the bank
  double squad_value = 10;   // £m, the sum of selling prices
  int32 free_transfers = 11; // for next_gameweek; an estimate, see notes
  repeated string chips_available = 12;  // "wildcard", "freehit", "bboost" (Bench Boost), "3xc" (Triple Captain)
  repeated SquadPlayer players = 13;     // in squad_position order
  repeated string notes = 14;            // caveats about the data above, in plain words
}

// ---------- Evaluating transfers ----------

message EvaluateTransfersRequest {
  int32 team_id = 1;
  // Players leaving and joining. Both lists must be the same length; order
  // doesn't matter (the squad rules are checked on the final squad).
  repeated int32 player_out_ids = 2;
  repeated int32 player_in_ids = 3;
  // The most points the manager accepts losing to extra transfers (4 per
  // transfer beyond the free ones). Unset = no limit; 0 = free transfers only.
  optional int32 max_hit = 4;
  // "wildcard" or "freehit" to make every transfer free (must be available).
  string chip = 5;
  // Gameweeks to project over, starting with the next one. 0 = server default (5); at most 10.
  int32 horizon = 6;

  // FPL only shows a squad as it was at the last deadline, so transfers the
  // manager has made since then are invisible to us. If the manager says how
  // things stand now, these override what we know. Give all three after
  // making transfers, or the money and free transfers will be out of date.
  repeated int32 current_squad_ids = 7;  // the 15 players in the squad right now
  optional double current_bank = 8;      // £m in the bank right now
  optional int32 free_transfers_available = 9;
}

message EvaluateTransfersResponse {
  // True if the transfers are allowed: the final squad obeys every FPL rule
  // and the hit is within max_hit.
  bool valid = 1;
  repeated string violations = 2;  // why not, in plain words; empty when valid

  int32 transfers = 3;
  int32 free_transfers = 4;  // an estimate, see GetManagerTeam
  int32 hit = 5;             // points deducted, e.g. 4 or 8; 0 if all free

  double bank_before = 6;    // £m
  double bank_after = 7;     // £m; negative means unaffordable

  // FPL's expected points for the next gameweek only. Ignores who would
  // actually start, so treat it as a rough guide.
  double expected_points_out = 8;   // sum over players leaving
  double expected_points_in = 9;    // sum over players joining
  double expected_points_net = 10;  // in - out - hit

  repeated PlayerOutlook players_out = 11;
  repeated PlayerOutlook players_in = 12;
  repeated string notes = 13;

  // The same comparison over `horizon` gameweeks, using our projections.
  // This, not the next-gameweek-only numbers above, is what to weigh a points hit against.
  int32 horizon = 14;
  double projected_points_out = 15;  // summed over the players leaving
  double projected_points_in = 16;   // summed over the players joining
  // The change in the projected points of the best starting eleven, minus the
  // hit. Only 11 of the 15 players score, so this is smaller than in - out when
  // a bench player is involved.
  double projected_points_net = 17;
}

// ---------- Suggesting transfers (not implemented yet) ----------

message SuggestTransfersRequest {
  int32 team_id = 1;
  int32 max_transfers = 2;  // 0 = up to the free transfers available (at least 1); at most 3
  optional int32 max_hit = 3;
  int32 horizon = 4;  // gameweeks to project over; 0 = server default (5); at most 10
  // As in EvaluateTransfersRequest: the manager's squad, bank and free
  // transfers right now, if they differ from what FPL showed at the last deadline.
  repeated int32 current_squad_ids = 5;
  optional double current_bank = 6;
  optional int32 free_transfers_available = 7;
}

// A player in a suggested transfer.
message TransferPlayer {
  int32 id = 1;
  string web_name = 2;
  string team_name = 3;
  Position position = 4;
  double price = 5;  // £m: what he sells for (players out) or costs (players in)
  double projected_points = 6;  // over the horizon
}

message TransferSuggestion {
  repeated int32 player_out_ids = 1;
  repeated int32 player_in_ids = 2;
  int32 hit = 3;                    // points deducted
  // The change in the projected points of the best starting eleven over the
  // horizon, minus the hit.
  double expected_points_gain = 4;
  repeated TransferPlayer players_out = 5;
  repeated TransferPlayer players_in = 6;
  double bank_after = 7;  // £m
}

message SuggestTransfersResponse {
  // Legal transfer sets that gain points, best first. Every one has been
  // checked against all the squad rules. Empty means no transfer is worth
  // making (within the hit the manager accepts).
  repeated TransferSuggestion suggestions = 1;
  int32 horizon = 2;
  repeated string notes = 3;
}
