[project]
name = "fpl-data-service"
version = "0.1.0"
description = "Squad Scout data service: FPL data cache, manager teams and the transfer verifier, served over gRPC"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",  # the standard "are you alive?" check
    "grpcio-reflection>=1.66",       # lets grpcurl list the RPCs without the .proto file
    "protobuf>=5.28",
    "httpx>=0.27",                   # async HTTP client for the FPL API
    "pydantic>=2.7",                 # decodes and validates FPL's JSON
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",   # bundles protoc; used by `make proto`
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/squadscout"]  # generated protobuf code

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]  # pycodestyle errors, pyflakes, import order, modern syntax, likely bugs
