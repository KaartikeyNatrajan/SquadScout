[project]
name = "langgraph-service"
version = "0.1.0"
description = "Squad Scout agent: LangGraph orchestrator exposed over FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "grpcio>=1.66",
    "protobuf>=5.28",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",   # bundles protoc; used by `make proto` for both Go and Python
    "httpx>=0.27",          # required by fastapi.testclient
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/squadscout"]  # generated protobuf code
